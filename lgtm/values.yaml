# values.yaml
# override this in separate values-environment.yaml
# match storageClass/storageClassName found in this file 
persistentVolumes: []

# kube-prometheus-stack: disable Grafana to avoid duplication
kube-prometheus-stack:
  enabled: true
  grafana:
    enabled: true
  prometheus:
    prometheusSpec:
      replicas: 1
      retention: 24h
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: prometheus-hostpath
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi  # ← Matches values-local.yaml
      initContainers:
        - name: chown-data
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:2000 /prometheus"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: prometheus-lgtm-kube-prometheus-stack-prometheus-db
              mountPath: /prometheus
              subPath: prometheus-db
  alertmanager:
    enabled: false
  nodeExporter:
    enabled: false
  kubeStateMetrics:
    enabled: true
  prometheus-node-exporter:
    hostRootFsMount:
      enabled: false

# Loki: monolithic mode
loki:
  enabled: true
  deploymentMode: Monolithic
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: loki-hostpath
      size: 5Gi  # ← Matches values-local.yaml
    initContainers:
      - name: chown-data
        image: busybox:1.36
        command: ["sh", "-c", "chown -R 10001:10001 /var/loki"]
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
          - name: storage
            mountPath: /var/loki
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  commonConfig:
    replication_factor: 1

  # Chunks cache
  chunksCache:
    enabled: true
    persistence:
      enabled: true
      storageClass: loki-chunks-cache-hostpath
      storageSize: 5Gi
    initContainers:
      - name: chown-data
        image: busybox:1.36
        command: ["sh", "-c", "chown -R 11211:11211 /data"]
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
          - name: data
            mountPath: /data

  # Results cache (disabled for basic mode)
  resultsCache:
    enabled: false

  # Loki runtime configuration
  loki:
    auth_enabled: false
    server:
      http_listen_port: 3100
    storage:
      bucketNames:
        chunks: lgtm-loki-chunks
        ruler: lgtm-loki-ruler
    #   type: filesystem
    #   filesystem:
    #     rules_directory: /loki/rules
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

  minio:
    enabled: false
  monitoring:
    selfMonitoring:
      enabled: false
    lokiCanary:
      enabled: false
  test:
    enabled: false
  gateway:
    enabled: true
    replicas: 1

# Tempo: single-binary mode
tempo:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    storageClassName: tempo-hostpath  # ← Fixed from hostpath
    size: 5Gi  # ← Matches values-local.yaml
  # storage:
  #   trace:
  #     backend: local
  #     wal:
  #       path: /var/tempo/wal
  #     local:
  #       path: /var/tempo/blocks
  distributor:
    receivers:
      otlp:
        http:
          enabled: true
        grpc:
          enabled: true
  metricsGenerator:
    enabled: false
  gateway:
    enabled: true
  jaeger:
    enabled: false
  zipkin:
    enabled: false
  opencensus:
    enabled: false
  initContainers:
    - name: chown-data
      image: busybox:1.36
      command: ["sh", "-c", "chown -R 10001:10001 /var/tempo"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: storage
          mountPath: /var/tempo

# Pyroscope: single-binary mode
pyroscope:
  enabled: true
  pyroscope:
    server:
      replicas: 1
    persistence:
      enabled: true
      storageClassName: pyroscope-hostpath
      size: 5Gi  # ← Matches values-local.yaml
    # storage:
    #   type: filesystem
    #   filesystem:
    #     path: /var/pyroscope
    minio:
      enabled: false
    initContainers:
      - name: chown-data
        image: busybox:1.36
        command: ["sh", "-c", "chown -R 10001:10001 /data /data-metastore"]
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
          - name: data
            mountPath: /data
          - name: data
            mountPath: /data-metastore
            subPath: .metastore

# OpenTelemetry Operator: keep disabled ok unless you know what you're doing
opentelemetry:
  operator:
    enabled: false

# OpenTelemetry Collector
opentelemetry-collector:
  enabled: true
  mode: deployment
  replicaCount: 1
  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
  command:
    name: otelcol-k8s
  resources:
    limits:
      memory: 256Mi
  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
  config:
    receivers:
      jaeger: null
      zipkin: null
      prometheus: null
      otlp:
        protocols:
          grpc: {}
          http: {}
    exporters:
      debug:
        verbosity: basic
      otlphttp/loki:
        endpoint: http://lgtm-loki-gateway:80/otlp
        tls:
          insecure: true
      otlp/tempo:
        endpoint: lgtm-tempo:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [otlp/tempo]
        logs:
          receivers: [otlp]
          exporters: [otlphttp/loki]
        metrics: null
