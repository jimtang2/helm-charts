apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy: 
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.container.image.repository }}:{{ .Values.container.image.tag }}"
        imagePullPolicy: {{ .Values.container.image.pullPolicy }}
        command:
          {{- toYaml .Values.container.command | nindent 10 }}
        args:
          {{- toYaml .Values.container.args | nindent 10 }}
        ports:
          {{- toYaml .Values.container.ports | nindent 10 }}
        env:
          {{- toYaml .Values.container.env | nindent 10 }}
        envFrom:
          {{- toYaml .Values.container.envFrom | nindent 10 }}
        resources:
          {{- toYaml .Values.container.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.container.securityContext | nindent 12 }}
        livenessProbe:
          {{- toYaml .Values.container.livenessProbe | nindent 12 }}
        readinessProbe:
          {{- toYaml .Values.container.readinessProbe | nindent 12 }}
        volumeMounts:
          {{- toYaml .Values.container.volumeMounts | nindent 10 }}

      volumes:
        {{- toYaml .Values.volumes | nindent 8 }}      
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      serviceAccountName: {{ include "chart.fullname" . }}
      enableServiceLinks: true
      automountServiceAccountToken: true
      priorityClassName: ""
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      hostAliases:
        {{ toYaml .Values.hostAliases | nindent 8}}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
