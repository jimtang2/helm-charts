# use gateway httproute
httproute:
  parentRefs: []
  hostnames: []

# matches container.ports
service:
  ports:
    - name: http
      port: 4180
      targetPort: 4180
      protocol: TCP
      appProtocol: http

# deployment config
replicaCount: 1
revisionHistoryLimit: 4
strategy: 
  type: Recreate

# deployment of one container
# oauth2-proxy container config
container:
  image:
    repository: "quay.io/oauth2-proxy/oauth2-proxy"
    tag: "v7.15.3"
    pullPolicy: "IfNotPresent"
  command: []

  # CONFIG METHOD #1: cli arguments
  args: 
    - --http-address=0.0.0.0:4180
    - --https-address=0.0.0.0:4443
    - --config=/etc/oauth2_proxy/oauth2_proxy.cfg

  # CONFIG METHOD #2: environment variable
  env: []
  envFrom: []

  # CONFIG METHOD #3: config file
  volumeMounts:
    - name: configmain
      mountPath: /etc/oauth2_proxy/oauth2_proxy.cfg
      readOnly: true

  ports:
    - containerPort: 4180
      name: http
      protocol: TCP

  resources: {}
  securityContext: {}

  livenessProbe:
    httpGet:
      path: /ping
      port: http
      scheme: HTTP
    initialDelaySeconds: 0
    timeoutSeconds: 1

  readinessProbe:
    httpGet:
      path: /ready
      port: http
      scheme: HTTP
    initialDelaySeconds: 0
    timeoutSeconds: 5
    periodSeconds: 10
    successThreshold: 1

# override this with a volume named 'configmain'
volumes: []
# - name: configmain 
#   hostPath:
#     path: /path/to/oauth2-proxy.cfg
#     type: FileOrCreate
securityContext: {}
imagePullSecrets: []
hostAliases: []
affinity: {}
nodeSelector: {}
tolerations: []
enableServiceLinks: true
topologySpreadConstraints: []
