#
# http -> envoy-edge to envoy-lab9-studio
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab9-studio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    hostname: "lab9.studio"
spec:
  parentRefs:
  - name: {{ include "chart.fullname" . }}-edge
    namespace: {{ .Release.Namespace }}
    sectionName: http-lab9-studio
    port: 80
  hostnames:
  - "*.lab9.studio"
  - "lab9.studio"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: "/"
    filters: []
    backendRefs:
    - name: {{ include "chart.fullname" . }}-lab9-studio
      namespace: {{ .Release.Namespace }}
      port: 28080
      weight: 1

---