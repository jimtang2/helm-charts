apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "chart.fullname" . }}-localhost
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    hostname: "localhost"
  annotations: 
    "helm.sh/hook": post-install,post-upgrade
spec:
  gatewayClassName: {{ include "chart.fullname" . }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ include "chart.fullname" . }}-localhost
  listeners:
    #
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
    # 
    - name: https
      protocol: HTTPS
      port: 8443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: localhost-tls-cert
            kind: Secret
            group: ""
    #
    - name: postgresql
      protocol: TCP
      port: 5432
      allowedRoutes:
        kinds:
          - kind: TCPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: All

---