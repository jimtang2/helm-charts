#
# http -> envoy-edge to envoy-localhost
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: localhost
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    hostname: "localhost"
spec:
  parentRefs:
  - name: {{ include "chart.fullname" . }}-edge
    namespace: {{ .Release.Namespace }}
    sectionName: http-localhost
    port: 80
  - name: {{ include "chart.fullname" . }}-edge
    namespace: {{ .Release.Namespace }}
    sectionName: http-localhost-apex
    port: 80
  hostnames:
  - "*.localhost"
  - "localhost"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: "/"
    filters: []
    backendRefs:
    - name: {{ include "chart.fullname" . }}-localhost
      namespace: {{ .Release.Namespace }}
      port: 8080
      weight: 1

---