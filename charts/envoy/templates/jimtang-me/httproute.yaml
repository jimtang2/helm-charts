#
# http -> envoy-edge to envoy-jimtang-me
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jimtang-me
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    hostname: "jimtang.me"
spec:
  parentRefs:
  - name: {{ include "chart.fullname" . }}-edge
    namespace: {{ .Release.Namespace }}
    sectionName: http-jimtang-me
    port: 80
  hostnames:
  - "*.jimtang.me"
  - "jimtang.me"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: "/"
    filters: []
    backendRefs:
    - name: {{ include "chart.fullname" . }}-jimtang-me
      namespace: {{ .Release.Namespace }}
      port: 18080
      weight: 1

---