apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "chart.fullname" . }}-jimtang-me
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    hostname: "jimtang.me"
  annotations:
    "helm.sh/hook": post-install,post-upgrade
spec:
  gatewayClassName: {{ include "chart.fullname" . }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ include "chart.fullname" . }}-jimtang-me
  listeners:
    # 
    - name: http
      protocol: HTTP
      port: 18080
      allowedRoutes:
        namespaces:
          from: All
    # 
    - name: https
      protocol: HTTPS
      port: 18443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: jimtang-me-tls-cert
            kind: Secret
            group: ""
        # mode: Passthrough

---