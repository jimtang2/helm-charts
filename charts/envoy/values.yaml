gatewayClassName: envoy
gateways:
#
# 1. edge
#
- name: edge
  envoyProxy:
    logLevel: info
    disablePrometheus: true
  listeners:
  #
  # 1.1. edge:localhost
  #
  - name: http-localhost
    port: 80
    protocol: HTTP
    hostname: "*.localhost"
  - name: tls-localhost
    port: 443
    protocol: TLS
    hostname: "*.localhost"
    tls:
      mode: Passthrough
  - name: http-localhost-apex
    port: 80
    protocol: HTTP
    hostname: "localhost"
  - name: tls-localhost-apex
    port: 443
    protocol: TLS
    hostname: "localhost"
    tls:
      mode: Passthrough
  #
  # 1.2. edge:jimtang.me
  #
  - name: http-jimtang-me
    port: 80
    protocol: HTTP
    hostname: "jimtang.me"
  - name: tls-jimtang-me
    port: 443
    protocol: TLS
    hostname: "jimtang.me"
    tls:
      mode: Passthrough
  #
  # 1.3. edge:lab9.studio
  # 
  - name: http-lab9-studio
    port: 80
    protocol: HTTP
    hostname: "lab9.studio"
  - name: tls-lab9-studio
    port: 443
    protocol: TLS
    hostname: "lab9.studio"
    tls:
      mode: Passthrough
  httproutes: []
  tlsroutes: []
#
# 2. localhost
#
- name: localhost
  envoyProxy:
    logLevel: info
    disablePrometheus: true
  listeners:
  - name: http
    protocol: HTTP
    port: 8080
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    protocol: HTTPS
    port: 8443
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - name: localhost-tls-cert
        kind: Secret
        group: ""
  - name: postgresql
    protocol: TCP
    port: 5432
    allowedRoutes:
      kinds:
      - kind: TCPRoute
        group: gateway.networking.k8s.io
      namespaces:
        from: All
  httproutes:
  - name: localhost
    parentRefs:
    - name: edge
      sectionName: http-localhost
      port: 80
    - name: edge
      sectionName: http-localhost-apex
      port: 80
    hostnames:
    - "*.localhost"
    - "localhost"
    rules:
    - backendRefs:
      - name: localhost
        port: 8080
  tlsroutes:
  - name: localhost
    parentRefs:
    - name: edge
      sectionName: tls-localhost
      port: 443
    - name: edge
      sectionName: tls-localhost-apex
      port: 443
    hostnames:
    - "*.localhost"
    - "localhost"
    rules:
    - backendRefs:
      - name: localhost
        port: 8443
#
# 3. jimtang-me
#
- name: jimtang-me
  envoyProxy:
    logLevel: info
    disablePrometheus: true
  listeners:
  - name: http
    protocol: HTTP
    port: 18080
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    protocol: HTTPS
    port: 18443
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - name: jimtang-me-tls-cert
        kind: Secret
        group: ""
  httproutes:
  - name: jimtang-me
    parentRefs:
    - name: edge
      sectionName: http-jimtang-me
      port: 80
    hostnames:
    - "*.jimtang.me"
    - "jimtang.me"
    rules:
    - backendRefs:
      - name: jimtang-me
        port: 18080
  tlsroutes:
  - name: jimtang-me
    parentRefs:
    - name: edge
      sectionName: tls-jimtang-me
      port: 443
    hostnames:
    - "*.jimtang.me"
    - "jimtang.me"
    rules:
    - backendRefs:
      - name: jimtang-me
        port: 18443
#
# 4. lab9-studio
#
- name: lab9-studio
  envoyProxy:
    logLevel: info
    disablePrometheus: true
  listeners:
  - name: http
    protocol: HTTP
    port: 28080
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    protocol: HTTPS
    port: 28443
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - name: lab9-studio-tls-cert
        kind: Secret
        group: ""
  httproutes:
  - name: lab9-studio
    parentRefs:
    - name: edge
      sectionName: http-lab9-studio
      port: 80
    hostnames:
    - "*.lab9.studio"
    - "lab9.studio"
    rules:
    - backendRefs:
      - name: lab9-studio
        port: 28080
  tlsroutes:
  - name: lab9-studio
    parentRefs:
    - name: edge
      sectionName: tls-lab9-studio
      port: 443
    hostnames:
    - "*.lab9.studio"
    - "lab9.studio"
    rules:
    - backendRefs:
      - name: lab9-studio
        port: 28443

envoy-gateway:
  gatewayAPI:
    safeUpgradePolicy:
      enabled: false

  global:
    imageRegistry: ""
    imagePullSecrets: []
    images:
      envoyGateway:
        image: "envoyproxy/gateway:v1.8.2"
        pullPolicy: IfNotPresent
        pullSecrets: []
      ratelimit:
        image: "docker.io/envoyproxy/ratelimit:master"
        pullPolicy: IfNotPresent
        pullSecrets: []
      envoyProxy:
        image: ""
        pullPolicy: ""
        pullSecrets: []

  commonLabels: {}

  podDisruptionBudget:
    minAvailable: 0

  deployment:
    annotations: {}
    envoyGateway:
      image:
        repository: ""
        tag: ""
      imagePullPolicy: ""
      imagePullSecrets: []
      extraEnv: []
      resources:
        limits:
          memory: 1024Mi
        requests:
          cpu: 100m
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        privileged: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsGroup: 65532
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # -- Volume source for the Wasm module cache mounted at /var/lib/eg/wasm. Defaults to an emptyDir when left empty.
      # Example: persist the Wasm module cache across controller restarts by backing it with a PersistentVolumeClaim:
      #   wasmCacheVolume:
      #     persistentVolumeClaim:
      #       claimName: envoy-gateway-wasm-cache
      strategy: {}
      wasmCacheVolume: {}
    ports:
      - name: grpc
        port: 18000
        targetPort: 18000
      - name: ratelimit
        port: 18001
        targetPort: 18001
      - name: wasm
        port: 18002
        targetPort: 18002
      - name: metrics
        port: 19001
        targetPort: 19001
    priorityClassName: null
    replicas: 1
    pod:
      affinity: {}
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '19001'
      labels: {}
      topologySpreadConstraints: []
      tolerations: []
      nodeSelector: {}
      # Additional volumeMounts on the deployment definition.
      extraVolumeMounts: []
      # - name: foo
      #   mountPath: "/etc/foo"
      #   readOnly: true
      # Additional volumes on the deployment definition.
      extraVolumes: []
      # - name: foo
      #   configMap:
      #     name: myconfigmap
      securityContext:
        runAsNonRoot: true
        runAsGroup: 65532
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

  service:
    # If set to PreferClose, the Envoy fleet will prioritize connecting to the Envoy Gateway pods that are topologically closest to them.
    trafficDistribution: ""
    annotations: {}
    # -- Service type. Can be set to LoadBalancer with specific IP, e.g.:
    # type: LoadBalancer
    # loadBalancerIP: 10.236.90.20
    type: "ClusterIP"

  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    metrics: []
    behavior: {}

  config:
  # -- EnvoyGateway configuration. Visit https://gateway.envoyproxy.io/docs/api/extension_types/#envoygateway to view all options.
    envoyGateway:
      gateway:
        controllerName: gateway.envoyproxy.io/gatewayclass-controller
      provider:
        type: Kubernetes
      logging:
        level:
          default: info
      extensionApis: {}

  namespaceOverride: ""

  kubernetesClusterDomain: cluster.local

  # -- Certgen is used to generate the certificates required by EnvoyGateway. If you want to construct a custom certificate, you can generate a custom certificate through Cert-Manager before installing EnvoyGateway. Certgen will not overwrite the custom certificate. Please do not manually modify `values.yaml` to disable certgen, it may cause EnvoyGateway OIDC,OAuth2,etc. to not work as expected.
  certgen:
    job:
      annotations: {}
      args: []
      pod:
        annotations: {}
        labels: {}
        securityContext:
          runAsNonRoot: true
          runAsGroup: 65532
          runAsUser: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
      resources: {}
      affinity: {}
      tolerations: []
      nodeSelector: {}
      ttlSecondsAfterFinished: 30
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        privileged: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsGroup: 65532
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
    rbac:
      annotations: {}
      labels: {}

  topologyInjector:
    enabled: false
    annotations: {}
