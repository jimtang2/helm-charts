enabled: true

envoy-gateway:
  gatewayAPI:
    safeUpgradePolicy:
      enabled: false

  global:
    imageRegistry: ""
    imagePullSecrets: []
    images:
      envoyGateway:
        image: "envoyproxy/gateway:v1.8.2"
        pullPolicy: IfNotPresent
        pullSecrets: []
      ratelimit:
        image: "docker.io/envoyproxy/ratelimit:master"
        pullPolicy: IfNotPresent
        pullSecrets: []
      envoyProxy:
        image: ""
        pullPolicy: ""
        pullSecrets: []

  commonLabels: {}

  podDisruptionBudget:
    minAvailable: 0

  deployment:
    annotations: {}
    envoyGateway:
      image:
        repository: ""
        tag: ""
      imagePullPolicy: ""
      imagePullSecrets: []
      extraEnv: []
      resources:
        limits:
          memory: 1024Mi
        requests:
          cpu: 100m
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        privileged: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsGroup: 65532
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # -- Volume source for the Wasm module cache mounted at /var/lib/eg/wasm. Defaults to an emptyDir when left empty.
      # Example: persist the Wasm module cache across controller restarts by backing it with a PersistentVolumeClaim:
      #   wasmCacheVolume:
      #     persistentVolumeClaim:
      #       claimName: envoy-gateway-wasm-cache
      strategy: {}
      wasmCacheVolume: {}
    ports:
      - name: grpc
        port: 18000
        targetPort: 18000
      - name: ratelimit
        port: 18001
        targetPort: 18001
      - name: wasm
        port: 18002
        targetPort: 18002
      - name: metrics
        port: 19001
        targetPort: 19001
    priorityClassName: null
    replicas: 1
    pod:
      affinity: {}
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '19001'
      labels: {}
      topologySpreadConstraints: []
      tolerations: []
      nodeSelector: {}
      # Additional volumeMounts on the deployment definition.
      extraVolumeMounts: []
      # - name: foo
      #   mountPath: "/etc/foo"
      #   readOnly: true
      # Additional volumes on the deployment definition.
      extraVolumes: []
      # - name: foo
      #   configMap:
      #     name: myconfigmap
      securityContext:
        runAsNonRoot: true
        runAsGroup: 65532
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

  service:
    # If set to PreferClose, the Envoy fleet will prioritize connecting to the Envoy Gateway pods that are topologically closest to them.
    trafficDistribution: ""
    annotations: {}
    # -- Service type. Can be set to LoadBalancer with specific IP, e.g.:
    # type: LoadBalancer
    # loadBalancerIP: 10.236.90.20
    type: "ClusterIP"

  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    metrics: []
    behavior: {}

  config:
  # -- EnvoyGateway configuration. Visit https://gateway.envoyproxy.io/docs/api/extension_types/#envoygateway to view all options.
    envoyGateway:
      gateway:
        controllerName: gateway.envoyproxy.io/gatewayclass-controller
      provider:
        type: Kubernetes
      logging:
        level:
          default: info
      extensionApis: {}

  namespaceOverride: ""

  kubernetesClusterDomain: cluster.local

  # -- Certgen is used to generate the certificates required by EnvoyGateway. If you want to construct a custom certificate, you can generate a custom certificate through Cert-Manager before installing EnvoyGateway. Certgen will not overwrite the custom certificate. Please do not manually modify `values.yaml` to disable certgen, it may cause EnvoyGateway OIDC,OAuth2,etc. to not work as expected.
  certgen:
    job:
      annotations: {}
      args: []
      pod:
        annotations: {}
        labels: {}
        securityContext:
          runAsNonRoot: true
          runAsGroup: 65532
          runAsUser: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
      resources: {}
      affinity: {}
      tolerations: []
      nodeSelector: {}
      ttlSecondsAfterFinished: 30
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        privileged: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsGroup: 65532
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
    rbac:
      annotations: {}
      labels: {}

  topologyInjector:
    enabled: false
    annotations: {}
