{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "redisinsight.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redisinsight.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
      {{- if .Values.httpRoute.matches }}
        {{- toYaml .Values.httpRoute.matches | nindent 8 }}
      {{- else }}
        - path:
            type: PathPrefix
            value: /
      {{- end }}
      backendRefs:
        - group: ''
          kind: Service
          name: {{ include "redisinsight.fullname" . }}
          port: 5540
          weight: 1
{{- end }}
