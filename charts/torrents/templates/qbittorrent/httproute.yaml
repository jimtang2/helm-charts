{{- if .Values.qbittorrent.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: localhost
    namespace: default
    sectionName: https
    port: 8443
  hostnames:
  - torrent.localhost
  rules:
  - backendRefs:
    - name: {{ include "chart.fullname" . }}
      namespace: {{ .Release.Namespace }}
      port: 8080
---
{{- end }}