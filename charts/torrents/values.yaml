qbittorrent:
  image:
    repository: linuxserver/qbittorrent
    tag: "5.2.3"
    pullPolicy: IfNotPresent
  env: []
  volumes:
    config:
      hostPath: ""
    downloads:
      hostPath: ""
  service:
    enabled: true
    type: ClusterIP
    ports:
      webui:
        port: 8080
        targetPort: 8080
        protocol: TCP
      torrent_tcp:
        port: 6881
        targetPort: 6881
        protocol: TCP
      torrent_udp:
        port: 6881
        targetPort: 6881
        protocol: UDP
  httproute:
    enabled: true

jackett:
  image:
    repository: linuxserver/jackett
    tag: "0.24.2237"
    pullPolicy: IfNotPresent
  volumes:
    config:
      hostPath: ""
    downloads:
      hostPath: ""
  env: []
  service:
    enabled: true
    type: ClusterIP
    ports:
      webui:
        port: 9117
        targetPort: 9117
        protocol: TCP
  httproute:
    enabled: true