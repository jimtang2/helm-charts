apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  namespace:  {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: audiobookshelf
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        livenessProbe: 
          httpGet:
            path: /
            port: http
        readinessProbe: 
          httpGet:
            path: /
            port: http
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        env:
        - name: TZ
          value: "UTC"
        volumeMounts:
        - name: audiobooks
          mountPath: /audiobooks
        - name: podcasts
          mountPath: /podcasts
        - name: config
          mountPath: /config
        - name: metadata
          mountPath: /metadata
      volumes:
      - name: audiobooks
        hostPath:
          path: {{ .Values.volumes.audiobooks.hostPath }}
          type: DirectoryOrCreate
      - name: podcasts
        hostPath:
          path: {{ .Values.volumes.podcasts.hostPath }}
          type: DirectoryOrCreate
      - name: config
        hostPath:
          path: {{ .Values.volumes.config.hostPath }}
          type: DirectoryOrCreate
      - name: metadata
        hostPath:
          path: {{ .Values.volumes.metadata.hostPath }}
          type: DirectoryOrCreate