apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: envoy-localhost
      namespace: net
      sectionName: https
      port: 8443
  hostnames:
    - grafana.localhost
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
      - name: prometheus-grafana
        port: 80
        weight: 1