apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: elasticsearch-es-http-tls
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: elasticsearch-es-http
    sectionName: https
  validation:
    caCertificateRefs:
    - group: ""
      kind: Secret
      name: elasticsearch-es-http-certs-public
    hostname: elasticsearch-es-http.{{ .Release.Namespace }}.svc
---