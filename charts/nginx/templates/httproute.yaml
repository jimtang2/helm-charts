{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  parentRefs: {{- toYaml .Values.httproute.parentRefs | nindent 2}}
  hostnames: {{- toYaml .Values.httproute.hostnames | nindent 2}}
  rules: {{- toYaml .Values.httproute.rules | nindent 2}}

---
{{- end }}