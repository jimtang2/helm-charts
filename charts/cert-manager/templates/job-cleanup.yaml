apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-cleanup"
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": hook-succeeded
  namespace: {{ .Release.Namespace }}
spec:
  template:
    spec:
      serviceAccountName: "{{ .Release.Name }}-cleanup"
      restartPolicy: Never
      containers:
      - name: cleanup
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          NAMESPACE="{{ .Release.Namespace }}"
          SELECTOR="app.kubernetes.io/instance={{ .Release.Name }}"
          kubectl get clusterissuer -l $SELECTOR --ignore-not-found -o name | xargs kubectl delete
          kubectl get certificates -n $NAMESPACE -l $SELECTOR --ignore-not-found -o name | xargs kubectl delete -n $NAMESPACE
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
      activeDeadlineSeconds: 30

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Release.Name }}-cleanup"
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ .Release.Name }}-cleanup"
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "5"
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: ["cert-manager.io"]
  resources: ["certificates", "clusterissuers"]
  verbs: ["list", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ .Release.Name }}-cleanup"
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "5"
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: "{{ .Release.Name }}-cleanup"
roleRef:
  kind: Role
  name: "{{ .Release.Name }}-cleanup"
  apiGroup: rbac.authorization.k8s.io