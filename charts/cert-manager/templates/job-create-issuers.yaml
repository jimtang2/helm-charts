# wait for webhook available to create issuers
# (re)-apply clusterissuers
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-create-issuers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-cert-manager-bootstrap
      restartPolicy: OnFailure
      containers:
      - name: kubectl
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -ec
        - |
          NS="{{ .Release.Namespace }}"
          TIMEOUT=60s

          kubectl wait --for=condition=Available=True deployment/cert-manager -n "${NS}" --timeout=$TIMEOUT
          kubectl wait --for=condition=Available=True deployment/cert-manager-webhook -n "${NS}" --timeout=$TIMEOUT
          kubectl wait --for=condition=Available=True deployment/cert-manager-cainjector -n "${NS}" --timeout=$TIMEOUT || true

          cat <<'EOF' | kubectl apply -f -
            {{- include "issuers.localhost" . | nindent 12 }}
          EOF
          cat <<'EOF' | kubectl apply -f -
            {{- include "issuers.jimtang-me" . | nindent 12 }}
          EOF
          cat <<'EOF' | kubectl apply -f -
            {{- include "issuers.lab9-studio" . | nindent 12 }}
          EOF

---