volumes:
  wwwDir: 
    hostPath: /Users/jimtang/Development/vol/nginx/www/home
  configDir: 
    hostPath: /Users/jimtang/Development/vol/nginx/public/conf.d
  config:
    hostPath: /Users/jimtang/Development/vol/nginx/public/nginx.conf

httproute:
  enabled: true
  parentRefs:
  - name: jimtang-me
    namespace: default
    sectionName: http
    port: 18080
  - name: jimtang-me
    namespace: default
    sectionName: https
    port: 18443
  - name: lab9-studio
    namespace: default
    sectionName: http
    port: 28080
  - name: lab9-studio
    namespace: default
    sectionName: https
    port: 28443
  hostnames:
  - www.jimtang.me
  - www.lab9.studio
  - jimtang.me
  - lab9.studio
  rules:
  - matches:
    - path:
        type: Exact
        value: "/"
    - path:
        type: RegularExpression
        value: "^/index\\.(js|html)$"
    - path:
        type: PathPrefix
        value: "/favicon.ico"
    backendRefs:
    - name: nginx-public
      namespace: public
      port: 80
  