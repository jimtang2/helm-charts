# bases:
# - environments.yaml

helmDefaults:
  createNamespace: true
  skipCRDs: false
  skipDeps: true
  skipRefresh: true
  cleanupOnFail: true
  takeOwnership: true
  forceConflicts: true
  serverSide: true

commonLabels:
  install: helmfile

releases:
  #
  # ns:default
  #
  - name: envoy
    chart: ./envoy
    installed: true
    suppressDiff: true
  - name: cert-manager
    chart: ./cert-manager
    values:
    - reIssue: false
    suppressDiff: true
    installed: true
  - name: postgresql
    chart: ./postgresql
    installed: true
    values:
    - ./postgresql/values.yaml
    - ../values/postgresql.yaml
  - name: elastic
    chart: ./elastic
    installed: false
    values:
    - ./elastic/values.yaml
    - ../values/elasticsearch.yaml
  - name: prometheus
    chart: ./prometheus
    installed: false
  - name: fluent-bit
    chart: ./fluent-bit
    values:
    - ./fluent-bit/values.yaml
    - ../values/fluent-bit.yaml
    installed: false
  - name: keycloak
    chart: ./keycloak
    installed: true
  # - name: kafka
  #   chart: ./kafka
  # - name: redis
  #   chart: ./redis
  - name: stalwart
    chart: ./stalwart
    installed: true
    values:
    - ./stalwart/values.yaml
    - ../values/stalwart.yaml
  # - name: oauth2-proxy
  #   chart: ./oauth2-proxy
  # - name: flux
  #   chart: ./flux
  # - name: jaeger
  #   chart: ./jaeger
  #
  # ns:internal
  #
  - name: audiobooks
    chart: ./audiobooks
    namespace: internal
    installed: true
    values:
    - ./audiobooks/values.yaml
    - ../values/audiobookshelf.yaml
  - name: torrents
    chart: ./torrents
    namespace: internal
    installed: true
    values:
    - ./torrents/values.yaml
    - ../values/torrents.yaml
  - name: nginx-internal
    chart: ./nginx
    namespace: internal
    values:
    - ./nginx/values.yaml
    - ../values/nginx-internal.yaml
    installed: true
  - name: headlamp
    chart: ./internal/headlamp
    namespace: internal
    installed: false
  #
  # ns:public
  #
  - name: nginx-public
    chart: ./nginx
    namespace: public
    values:
    - ./nginx/values.yaml
    - ../values/nginx-public.yaml
    installed: true
