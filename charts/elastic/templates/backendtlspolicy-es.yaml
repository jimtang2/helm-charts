# BackendTLSPolicy is needed to accept the TLS certificate auto-generated by the eck-stack chart
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: elasticsearch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: elasticsearch-es-http
    sectionName: https
  validation:
    caCertificateRefs:
    - group: ""
      kind: Secret
      name: elasticsearch-es-http-certs-public
    hostname: elasticsearch-es-http.{{ .Release.Namespace }}.svc
---