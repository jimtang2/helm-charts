{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  parentRefs:
  # - name: envoy-localhost
  #   namespace: net
  #   sectionName: http
  #   port: 8080
  - name: envoy-localhost
    namespace: net
    sectionName: https
    port: 8443
  # - name: envoy-jimtang-me
  #   namespace: net
  #   sectionName: https
  #   port: 18443
  # - name: envoy-lab9-studio
  #   namespace: net
  #   sectionName: https
  #   port: 28443
  hostnames:
  - nginx.localhost
  - localhost
  # - jimtang.me
  # - lab9.studio
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: "/"
    filters: []
    backendRefs:
    - name: {{ include "chart.fullname" . }}
      namespace: {{ .Release.Namespace }}
      port: 80
      weight: 1

---
{{- end }}