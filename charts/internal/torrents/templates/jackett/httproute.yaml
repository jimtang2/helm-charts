{{- if .Values.jackett.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "chart.fullname" . }}-jackett
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: envoy-localhost
    namespace: default
    sectionName: https
    port: 8443
  hostnames:
  - jackett.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: "/"
    filters: []
    backendRefs:
    - name: {{ include "chart.fullname" . }}-jackett
      namespace: {{ .Release.Namespace }}
      port: 9117
      weight: 1
---
{{- end }}