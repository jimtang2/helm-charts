apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-jackett
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: jackett
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jackett
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jackett
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: jackett
      namespace: {{ .Release.Namespace }}
    spec:
      containers:
      - name: jackett
        image: "{{ .Values.jackett.image.repository }}:{{ .Values.jackett.image.tag }}"
        imagePullPolicy: {{ .Values.jackett.image.pullPolicy }}
        env:
        - name: PUID
          value: "{{ .Values.jackett.env.PUID }}"
        - name: PGID
          value: "{{ .Values.jackett.env.PGID }}"
        - name: TZ
          value: "{{ .Values.jackett.env.TZ }}"
        - name: AUTO_UPDATE
          value: "{{ .Values.jackett.env.AUTO_UPDATE }}"
        ports:
        - containerPort: 9117
          name: webui
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
      volumes:
      - name: config
        hostPath:
          path: {{ .Values.jackett.volumes.config.hostPath }}
          type: DirectoryOrCreate
      - name: downloads
        emptyDir: {}
        # hostPath:
        #   path: {{ .Values.jackett.volumes.downloads.hostPath }}
        #   type: DirectoryOrCreate