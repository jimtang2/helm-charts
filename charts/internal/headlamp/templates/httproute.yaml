{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "headlamp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "headlamp.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: localhost
    sectionName: https
    port: 8443
  hostnames:
  - headlamp.localhost
  rules:
  - backendRefs:
    - name: {{ include "headlamp.fullname" . }}
      namespace: {{ .Release.Namespace }}
      port: 80
---
{{- end }}