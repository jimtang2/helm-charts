{{- if .Values.tcproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: {{ include "chart.fullname" . }}-tcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: envoy-localhost
    namespace: net
    sectionName: postgresql
    port: 5432
  rules:
  - name: postgresql
    backendRefs:
    - name: {{ include "chart.fullname" . }}
      namespace: {{ .Release.Namespace }}
      port: 5432
      weight: 1
---
{{- end }}
