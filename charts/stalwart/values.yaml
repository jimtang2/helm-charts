# Container image.
image:
  repository: stalwartlabs/stalwart
  tag: "v0.16"
  pullPolicy: IfNotPresent

# Number of pods in the StatefulSet.
replicaCount: 1

# Maps to STALWART_ROLE.
role: ""

# Maps to STALWART_PUSH_SHARD.
pushShard: ""

# Recovery / bootstrap administrator credential.
recoveryAdmin:
  enabled: true
  username: admin
  password: "change-me"

# Starts the pods in recovery mode.
recoveryMode:
  enabled: false
  port: 8080
  logLevel: info

# Extra environment variables injected into the container.
extraEnv: {}

# Extra environment variables injected from the managed Secret.
extraSecretEnv: {}
  # STALWART_DB_PASSWORD: password

# Use an existing ConfigMap containing config.json instead of rendering one.
existingConfigMap: ""

# Stalwart startup config file.
# This file should contain only the DataStore object used to locate the
# database at startup. The rest of Stalwart's configuration lives in the
# datastore and is managed through the WebUI / CLI after bootstrapping.
#
# Supported DataStore variants include RocksDb, FoundationDb, PostgreSql,
# MySql and Sqlite. Each variant has its own fields; examples for the most
# common layouts are below.
config:
  # Single-node default: embedded RocksDB on the persistent data volume.
  "@type": RocksDb
  path: /var/lib/stalwart

# Alternative startup config examples:
#
# config:
#   "@type": FoundationDb
#   clusterFile: /etc/foundationdb/fdb.cluster
#
# config:
#   "@type": PostgreSql
#   host: postgresql.data.svc.cluster.local
#   port: 5432
#   database: stalwart
#   authUsername: postgres
#   authSecret:
#     "@type": EnvironmentVariable
#     variableName: STALWART_DB_PASSWORD
#
# config:
#   "@type": MySql
#   host: mysql.db.svc.cluster.local
#   port: 3306
#   database: stalwart
#   authUsername: stalwart
#   authSecret:
#     "@type": EnvironmentVariable
#     variableName: STALWART_DB_PASSWORD
#
# config:
#   "@type": Sqlite
#   path: /var/lib/stalwart/stalwart.sqlite3
# Container ports exposed by the pod.
ports:
  smtp: 25
  smtps: 465
  submission: 587
  imap: 143
  imaps: 993
  pop3: 110
  pop3s: 995
  sieve: 4190
  http: 80
  https: 443
  mgmt: 8080

# Service ports.
service:
  type: ClusterIP
  ports:
    smtp: 25
    smtps: 465
    submission: 587
    imap: 143
    imaps: 993
    pop3: 110
    pop3s: 995
    sieve: 4190
    http: 80
    https: 443
    mgmt: 8080

# Ingress for the HTTP / HTTPS listeners only.
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: mail.example.org
      paths:
        - path: /
          pathType: Prefix
          portName: https
  tls: []

# TLS material mounted into the pod.
tls:
  enabled: false
  secretName: stalwart-tls
  mountPath: /etc/stalwart/tls

# Persistent volume for the data directory.
persistence:
  enabled: false
  mountPath: /var/lib/stalwart
  accessMode: ReadWriteOnce
  storageClass: ""
  size: 10Gi
  annotations: {}

# Health probes for the management listener.
livenessProbe:
  httpGet:
    path: /healthz/live
    port: mgmt
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz/ready
    port: mgmt
  initialDelaySeconds: 5
  periodSeconds: 10

# Resource requests and limits for the container.
resources: {}

# Pod-level security context.
podSecurityContext:
  fsGroup: 2000
  runAsUser: 2000
  runAsGroup: 2000

# Container-level security context for the stalwart container.
containerSecurityContext: {}
