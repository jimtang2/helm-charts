{{- $root := . }}
{{- $gatewayClassName := .Values.gatewayClassName }}
{{- $namespace := .Release.Namespace }}
{{- range $gateway := .Values.gateways }}
{{- range $route := $gateway.httproutes}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $route.name }}
  namespace: {{ default $namespace $route.namespace }}
  labels:
    {{- include "chart.labels" $root | nindent 4 }}
spec:
  parentRefs:
  {{- toYaml $route.parentRefs | nindent 2 }}
  hostnames:
  {{- toYaml $route.hostnames | nindent 2 }}
  rules:
  {{- toYaml $route.rules | nindent 2 }}
---
{{- end }}
{{- end }}