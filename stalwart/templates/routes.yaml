{{ $root := . }}
{{ $chartName := (include "chart.fullname" .) }}
{{ $namespace := .Release.Namespace }}
---
{{- range $route := .Values.httproutes }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $chartName }}-{{ $route.name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "chart.labels" $root | nindent 4 }}
spec:
  parentRefs: 
    {{- toYaml $route.parentRefs | nindent 4}}
  hostnames:
    {{- toYaml $route.hostnames | nindent 4}}
  rules:
    {{- toYaml $route.rules | nindent 4}}
---
{{- end }}

{{- range $route := .Values.tlsroutes }}
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: {{ $chartName }}-{{ $route.name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "chart.labels" $root | nindent 4 }}
spec:
  parentRefs: 
    {{- toYaml $route.parentRefs | nindent 4}}
  hostnames:
    {{- toYaml $route.hostnames | nindent 4}}
  rules:
    {{- toYaml $route.rules | nindent 4}}
---
{{- end }}

{{- range $route := .Values.tcproutes }}
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: {{ $chartName }}-{{ $route.name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "chart.labels" $root | nindent 4 }}
spec:
  parentRefs: 
    {{- toYaml $route.parentRefs | nindent 4}}
  rules:
    {{- toYaml $route.rules | nindent 4}}
---
{{- end }}